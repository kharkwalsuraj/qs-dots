[config]
import_json_files = ["./extra_colors.json"]

[config.wallpaper]
set = true
command = "awww img --transition-type center {{ image }}"


# dark themes

[templates.gtk3_dark]
input_path= '~/.config/matugen/templates/gtk/dark/colors3.css'
output_path= '~/.config/matugen/outputs/gtk/dark/colors3.css'

[templates.gtk4_dark]
input_path= '~/.config/matugen/templates/gtk/dark/colors4.css'
output_path= '~/.config/matugen/outputs/gtk/dark/colors4.css'

[templates.kde_colors_dark]
input_path= '~/.config/matugen/templates/kde/dark/MaterialDark.colors'
output_path = '~/.local/share/color-schemes/MaterialDark.colors'

[templates.kdeglobals_dark]
input_path= '~/.config/matugen/templates/kde/dark/kdeglobals-dark'
output_path = '~/.config/matugen/outputs/kde/kdeglobals-dark'

[templates.kitty_dark]
input_path = '~/.config/matugen/templates/kitty/colors.dark.conf'
output_path = '~/.config/matugen/outputs/kitty/colors.dark.conf'

[templates.hypr_dark]
input_path = '~/.config/matugen/templates/hypr/colors.dark.lua'
output_path = '~/.config/matugen/outputs/hypr/colors.dark.lua'

#light theme configs

[templates.gtk3_light]
input_path= '~/.config/matugen/templates/gtk/light/colors3.css'
output_path= '~/.config/matugen/outputs/gtk/light/colors3.css'

[templates.gtk4_light]
input_path= '~/.config/matugen/templates/gtk/light/colors4.css'
output_path= '~/.config/matugen/outputs/gtk/light/colors4.css'
post_hook= '~/.config/matugen/templates/gtk/setup.sh'

[templates.kde_colors_light]
input_path= '~/.config/matugen/templates/kde/light/MaterialLight.colors'
output_path = '~/.local/share/color-schemes/MaterialLight.colors'

[templates.kdeglobals_light]
input_path= '~/.config/matugen/templates/kde/light/kdeglobals-light'
output_path = '~/.config/matugen/outputs/kde/kdeglobals-light'
post_hook= '~/.config/matugen/templates/kde/setup.sh &' 

[templates.kitty_light]
input_path = '~/.config/matugen/templates/kitty/colors.light.conf'
output_path = '~/.config/matugen/outputs/kitty/colors.light.conf'
post_hook = '~/.config/matugen/templates/kitty/setup.sh'

[templates.hypr_light]
input_path = '~/.config/matugen/templates/hypr/colors.light.lua'
output_path = '~/.config/matugen/outputs/hypr/colors.light.lua'
post_hook = '~/.config/matugen/templates/hypr/setup.sh'
